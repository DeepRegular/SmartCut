<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="editor.title">カット編集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- The cut editor, in its own window. Opened on one clip out of the list
       and left again with OK or キャンセル; the list window is what says which
       clip, and what becomes of the cuts afterwards. -->
  <body>
    <header class="tabs">
      <span class="tab active still" data-i18n="editor.title">カット編集</span>
      <span class="title" id="title" data-i18n="editor.loading">読み込み中…</span>
    </header>

    <div class="infobar">
      <span id="info">—</span>
      <span class="spacer"></span>
      <button id="tracks" class="mini wide" data-i18n="tracks.button"
              data-i18n-title="tracks.button.title">トラック</button>
    </div>

    <main>
      <!-- Keyframes down the left, where the reference tool keeps them: the
           marks you navigate by, not the edit itself. -->
      <aside class="clips">
        <div class="clips-head">
          <span data-i18n="editor.keyframes">キーフレーム</span> <span id="key-count" class="dim"></span>
        </div>
        <ol id="keyframes" tabindex="0"></ol>
      </aside>

      <div class="editor">
        <!-- The sound, and the picture beside it. A row rather than the
             stage alone: the meter stands the full height of the picture,
             which is what makes it readable at a glance from across the
             timeline.

             To the left of the picture, where the eye already travels -- the
             marks are down that side too, and the readouts that belong to
             the frame (the counter, the subtitles) are on the picture
             itself. See `.meter` in the stylesheet. -->
        <div class="stage-row">
        <!-- 音声レベル. What is playing while it plays, and what is under the
             playhead while nothing is: the quiet at a junction is as much a
             part of finding a cut as the picture is. Drawn whole on a canvas
             -- bars, peak marks and the scale beside them -- because it is
             redrawn twenty times a second and a stack of elements being
             restyled at that rate is a window that stops repainting. -->
        <div class="meter" id="meter">
          <canvas id="meter-face"></canvas>
        </div>
        <div class="stage">
          <img id="preview" alt="" />
          <div class="overlay" id="overlay">
            <div class="ovl-main">
              <span id="ovl-frame">—</span>
              <span id="ovl-time">--:--:--.--</span>
            </div>
            <div class="ovl-sub">
              <span id="ovl-kind">—</span>
              <span id="ovl-sel" data-i18n="editor.selectionNone">選択 —</span>
            </div>
          </div>
          <!-- What the frame on screen is to the edit, on the picture's two
               top corners, where the reference tools put it: the head of the
               selection and the keyframes on the left, the end of the
               selection on the right, and whether a black, white or quiet
               stretch begins, ends or runs through here beside the mark.
               Over the whole stage: each corner goes in the black beside the
               picture where it fits and on the picture where it does not,
               and `placeMarks` measures which. -->
          <div id="marks-layer" class="marks" hidden>
            <div class="marks-l" id="marks-l"></div>
            <div class="marks-r" id="marks-r"></div>
          </div>
          <!-- The subtitles, over the picture and inside it: the layer is
               moved to wherever `object-fit: contain` actually put the
               picture, so a caption sits where the broadcaster put it
               whatever shape the window is. Characters are drawn on the
               canvas and a disc's pictures go in the <img>. -->
          <div id="subs-layer" class="subs" hidden>
            <canvas id="subs-text"></canvas>
            <img id="subs-pic" alt="" hidden />
          </div>
          <div id="searching" class="searching" data-i18n="editor.searching" hidden>サーチ中</div>
        </div>
        </div>

        <div class="strip-wrap">
          <div id="strip" class="strip">
            <div id="reel" class="reel"></div>
            <div id="playline" class="playline" hidden></div>
          </div>
          <div class="strip-foot">
            <!-- How the strip is worked, as this ?'s tooltip rather than two
                 lines of text under the strip: those were two lines taken off
                 the picture on a 1080p screen, for something read once. -->
            <span class="hint" data-i18n-title="editor.stripHint">?</span>
            <span class="spacer"></span>
            <span id="warm" class="warm"></span>
            <label class="opt"><span data-i18n="editor.stripShow">1 画面</span>
              <select id="strip-step">
                <option value="auto" selected data-i18n="strip.auto">自動</option>
                <option value="win:3" data-i18n="strip.win3">3 秒</option>
                <option value="win:6" data-i18n="strip.win6">6 秒</option>
                <option value="win:30" data-i18n="strip.win30">30 秒</option>
                <option value="win:180" data-i18n="strip.win180">3 分</option>
                <option value="frame" data-i18n="strip.frame">1 フレームずつ</option>
              </select>
            </label>
          </div>
        </div>

        <div class="track-wrap">
          <canvas id="track" height="80"></canvas>
          <div id="hover" class="hover" hidden>
            <img id="hover-img" alt="" />
            <div class="hover-foot"><span id="hover-time">--:--:--.--</span><span id="hover-kind"></span></div>
          </div>
        </div>

        <!-- Laid out like the reference tool's: the cut sits in the middle,
             IN to its left and OUT to its right, and the ways of getting
             about radiate outwards from there.

             The three clusters are their own elements so that a window too
             narrow for one line breaks it between them, keeping the symmetry
             around the cut on whichever line it lands. The row used to be one
             flat, unwrapping line that scrolled instead -- and the scroll bar
             it grew lay across the bottom of the buttons, where it swallowed
             the clicks meant for them. At the window's own default width. -->
        <div class="transport">
          <div class="tgroup">
            <button id="add-key" class="flag" data-i18n="t.addKey" data-i18n-title="t.addKey.title">⚑ キーフレーム</button>
            <button id="prev-scene" class="tool" data-i18n="t.prevScene" data-i18n-title="t.prevScene.title" disabled>⇤ シーン</button>
            <button id="next-scene" class="tool" data-i18n="t.nextScene" data-i18n-title="t.nextScene.title" disabled>シーン ⇥</button>
          </div>

          <div class="tgroup">
            <button id="go-start" data-i18n-title="t.goStart">|◀</button>
            <button id="prev-kf" data-i18n-title="t.prevKf">◀|</button>
            <button id="step-back" data-i18n-title="t.stepBack">◀</button>
            <button id="goto-in" data-i18n-title="t.gotoIn">⇤|</button>
            <button id="set-in" class="mark" data-i18n-title="t.setIn">[ IN</button>
            <button id="cut-range" class="cut" data-i18n="t.cut" data-i18n-title="t.cutRange">✂ カット</button>
            <button id="set-out" class="mark" data-i18n-title="t.setOut">OUT ]</button>
            <button id="goto-out" data-i18n-title="t.gotoOut">|⇥</button>
            <button id="step-fwd" data-i18n-title="t.stepFwd">▶</button>
            <button id="next-kf" data-i18n-title="t.nextKf">|▶</button>
            <button id="go-end" data-i18n-title="t.goEnd">▶|</button>
          </div>

          <!-- The edits, and where the playhead is, on a line of their own
               under the ways of moving -- where the window is too narrow for
               the edits to stand at the end of the row above. There they
               wrapped onto a second line anyway, centred, with the width
               either side of them empty, while the counter and the
               detection's note shared the playback row below and pushed it
               onto two lines of its own on a window half a screen wide. So
               the counter comes up to the left of them.

               Where the edits do fit at the end of the row above, they go
               there, and the counter goes to a row of its own under it (see
               `#player`). Which of the two it is, is the width of the
               buttons alone and not of anything they say; see
               `arrangeRows`.

               The counter is also where a frame number is typed in: a press
               on it, J or Ctrl+J (the reference tools' key) swaps it for the
               box beside it, filled with where the playhead is. See
               `openJump`. -->
          <div class="edit-row" id="edit-row">
          <!-- The counter and the selection, and what the detection found.
               Two lines in the edit row's one -- the note under the counter,
               where the row has no width to spare beside it -- and one line
               when they have a row of their own under the edits, the note
               beside the selection. -->
          <div class="readout-stack" id="readouts">
            <div class="readout readout-at" id="readout-at">
              <span class="counter" id="counter" data-i18n-title="editor.jump.title">— / —</span>
              <input id="counter-jump" class="counter-jump" type="text" hidden
                     inputmode="numeric" autocomplete="off" spellcheck="false"
                     data-i18n-title="editor.jump.title" />
              <span class="dim" id="selection" data-i18n="editor.selectionNone">選択 —</span>
            </div>
            <div class="readout-cm" id="readout-cm"><span class="dim" id="cm-note"></span></div>
          </div>
          <div class="tgroup">
            <button id="cut-outside" class="tool" data-i18n="t.cutOutside" data-i18n-title="t.cutOutside.title">外側をカット</button>
            <button id="snap" class="tool" data-i18n="t.snap" data-i18n-title="t.snap.title">無劣化点へ吸着</button>
            <button id="undo-cut" class="tool" data-i18n="t.undo" data-i18n-title="t.undo.title" disabled>↺ 取消</button>
            <button id="redo-cut" class="tool" data-i18n="t.redo" data-i18n-title="t.redo.title" disabled>↻ やり直し</button>
            <button id="clear-all" class="tool" data-i18n="t.clearAll" data-i18n-title="t.clearAll.title">全消去</button>
          </div>

          <!-- The commands that are not a control: the mark files, the disc's
               own chapters, and clearing the marks alone. They are about the
               marks rather than about the picture under the playhead, they
               are reached once in a session and not in a minute, and a button
               each across the foot of the window would make the row they sit
               in longer than the cutting it is there for.

               At the right-hand end of the row, which is where the reference
               tool keeps its own, and where the eye is not while a cut is
               being placed. The menu opens upwards -- this row stands at the
               foot of the window -- and to the left, so it does not run off
               the edge of the screen behind the button that opened it. -->
          <!-- The button and its menu are the group itself, not a wrapper
               inside one: the group is what the menu is placed against, and
               the transport's own look is written for the buttons a group
               holds directly -- a menu standing inside one came out drawn as
               a row of transport buttons, box and border and all. -->
          <div class="tgroup">
            <button id="more" class="tool more" aria-haspopup="true" aria-expanded="false"
                    data-i18n-title="editor.more.title">≡</button>
            <div id="more-menu" class="menu up end" hidden>
              <!-- The three detections. They are separate lines because they
                   are separate passes: the
                   pictures are a minute on half an hour of broadcast and the
                   sound is seconds, so somebody after the silences alone
                   should not wait for the pictures. Their labels count a pass
                   up while it runs, which is why the word is in a span of its
                   own and `main.js` writes that rather than the line. -->
              <button class="menu-item" id="detect-cm" data-i18n-title="editor.detectCm.title">
                <span class="menu-label">CM を検出</span>
                <span class="menu-key">Ctrl+D</span>
              </button>
              <button class="menu-item" id="detect-blank" data-i18n-title="editor.detectBlank.title">
                <span class="menu-label">黒白を検出</span>
                <span class="menu-key">Ctrl+B</span>
              </button>
              <button class="menu-item" id="detect-silence" data-i18n-title="editor.detectSilence.title">
                <span class="menu-label">無音を検出</span>
                <span class="menu-key">Ctrl+Q</span>
              </button>
              <div class="menu-sep"></div>
              <!-- Reading first, as the reference tool has it: the file is
                   read once at the start of an evening and written at the end
                   of each recording, and the one that is reached for less
                   often is the one to put where the pointer already is.
                   Read back in the same numbers they were written in, so a
                   list written here and a list written by that tool land on
                   the same pictures. -->
              <button class="menu-item" id="load-keyframe">
                <span data-i18n="marks.load.keyframe">キーフレーム情報を読み込む</span>
                <span class="menu-key">Ctrl+L</span>
              </button>
              <button class="menu-item" id="load-trim">
                <span data-i18n="marks.load.trim">AviSynth Trim からカットを読み込む</span>
                <span class="menu-key">Ctrl+Shift+L</span>
              </button>
              <!-- The detection's own finding, which is neither of the other
                   two: a set of ranges that have not been cut, with how they
                   were arrived at attached. Minutes of reading the recording,
                   so it is worth being able to keep one and open it again. -->
              <button class="menu-item" id="load-cm">
                <span data-i18n="marks.load.cm">CM 検出結果を読み込む</span>
                <span class="menu-key">Ctrl+Alt+O</span>
              </button>
              <div class="menu-sep"></div>
              <!-- Saving asks for the name, because the shape was chosen by
                   picking the line rather than in the dialog's type list:
                   GTK's does not rewrite the name when the type beside it
                   changes, so a shape chosen there would look chosen and
                   write the other one. The shortcuts write straight to the
                   name beside the recording, with nothing to answer. -->
              <button class="menu-item" id="save-as-keyframe">
                <span data-i18n="marks.save.keyframe">キーフレーム情報を保存</span>
                <span class="menu-key">Ctrl+H</span>
              </button>
              <button class="menu-item" id="save-as-trim">
                <span data-i18n="marks.save.trim">AviSynth Trim にカットを保存</span>
                <span class="menu-key">Ctrl+Shift+H</span>
              </button>
              <button class="menu-item" id="save-as-cm">
                <span data-i18n="marks.save.cm">CM 検出結果を保存</span>
                <span class="menu-key">Ctrl+Alt+H</span>
              </button>
              <div class="menu-sep"></div>
              <!-- The disc's own chapter points, which a recording off a
                   Japanese recorder frequently has the commercial breaks
                   written into. Put down when the recording is opened, and
                   here for afterwards: they are the one source of marks
                   that cannot be asked for again once they have been
                   cleared. Greyed on anything that is not a disc. -->
              <button class="menu-item" id="chapter-keys">
                <span data-i18n="editor.chapterKeys">ディスクのチャプターをキーフレームにする</span>
              </button>
              <!-- The marks of a detection that is already on screen. Put
                   down when it lands, except onto a timeline that came up
                   with somebody's own list beside the recording -- there it
                   waits here. -->
              <button class="menu-item" id="cm-keys">
                <span data-i18n="editor.cmKeys">CM 検出結果をキーフレームにする</span>
              </button>
              <!-- And the two flat detections' ends, for the same case: the
                   band is under the timeline and the marks are not, because
                   the recording came up with somebody's own list or because
                   環境設定 says a detection is to be looked at before it is
                   marked. Two lines rather than one: the pictures and the
                   sound are asked for apart, and somebody who wants the
                   fades marked has not thereby asked for every silence.
                   Their labels name the stretches that are actually on the
                   timeline, so `showMore` writes them. -->
              <button class="menu-item" id="blank-keys">
                <span class="menu-label">黒白の区間をキーフレームにする</span>
              </button>
              <button class="menu-item" id="quiet-keys">
                <span class="menu-label">無音の区間をキーフレームにする</span>
              </button>
              <!-- The marks alone. 全消去 beside it takes the cuts as well,
                   which is not what somebody who is redoing the marks on an
                   edit they have kept is asking for. -->
              <button class="menu-item" id="clear-keys">
                <span data-i18n="editor.clearKeys">キーフレームをすべて消す</span>
              </button>
              <div class="menu-sep"></div>
              <!-- The picture the written file shows as its cover, in .mp4
                   and .mkv. See `poster` in main.js. -->
              <button class="menu-item" id="poster-set">
                <span data-i18n="poster.setItem">このフレームをサムネイルに設定</span>
                <span class="menu-key">P</span>
              </button>
              <button class="menu-item" id="poster-go">
                <span data-i18n="poster.goItem">サムネイルのフレームへ移動</span>
                <span class="menu-key" id="poster-at"></span>
              </button>
              <button class="menu-item" id="poster-clear">
                <span data-i18n="poster.clearItem">サムネイルの設定を解除</span>
              </button>
              <div class="menu-sep"></div>
              <!-- 拡大表示, in a window of its own. Here rather than as a
                   button on the transport: it is opened once and left open,
                   and the rows below the picture are for the cutting. The
                   tick says whether the window is up, which is the one thing
                   a menu item that toggles has to say. -->
              <button class="menu-item" id="zoom-toggle" aria-pressed="false">
                <span data-i18n="zoom.open">拡大表示</span>
                <span class="menu-key"><span class="tick">✓</span>Z</span>
              </button>
            </div>
          </div>
          </div>
        </div>

        <!-- Where the playhead is, when the edits have gone up to the end
             of the row above and left no edit row to stand in. Empty and out
             of the way otherwise; see `arrangeRows`. -->
        <div class="player" id="player"></div>

        <footer class="output" id="plan-panel">
          <div class="panel">
            <div class="bar"><span id="copied-bar"></span></div>
            <!-- The summary, and the button that unfolds the segments under
                 it. Folded out of the box; see `planOpen` in prefs.js. -->
            <div class="plan-head">
              <div class="plan-text" id="plan-text">ファイルを開いてください</div>
              <button id="plan-fold" class="mini" type="button" aria-expanded="false"
                      data-i18n-title="plan.fold.title"></button>
            </div>
            <!-- Wrapped, so the shadow that says "there is more below" can
                 be drawn over the list without scrolling away with it. -->
            <div class="segbox"><ul id="segments"></ul></div>
          </div>
          <!-- No 出力 button here. What gets written, where, and in what
               container is one answer for the whole list, and it is settled
               on the list window's own screens.

               OK and キャンセル instead, as the reference tool has them: this
               window is opened on one clip and left again, and those two are
               what say which way you left it. -->
          <div class="export">
            <span class="badge" id="smart-badge">—</span>
            <!-- What the preview carries, beside what the cut costs: the
                 counter on the picture, the marks in its corners, and which
                 subtitles to draw over it. Answers about the picture you are
                 looking at rather than about the file, so they are here,
                 where the eye already is while a cut is being placed.

                 One button with a menu rather than a button each: they are
                 set once and left, and three of them across this row took
                 the room the status line needs on a window half a screen
                 wide. The menu opens upwards, this row being the foot of the
                 window. Each line carries the tick for its own answer, the
                 way 拡大表示 does on ≡. -->
            <div class="viewgroup">
              <button id="view" class="mini" type="button" aria-haspopup="true" aria-expanded="false"
                      data-i18n-title="editor.view.title"><span data-i18n="editor.view">表示</span> ▴</button>
              <div id="view-menu" class="menu up" hidden>
                <!-- The frame number and the time, on the picture or off it:
                     they stand at the foot of the picture and so does a
                     subtitle, and which of the two may be in the way is the
                     person's to say. -->
                <button class="menu-item" id="counter-show" type="button" aria-pressed="true"
                        data-i18n-title="editor.counterShow.title">
                  <span data-i18n="editor.counterShow">カウンタ</span>
                  <span class="menu-key"><span class="tick">✓</span></span>
                </button>
                <!-- The marks in the picture's top corners. Apart from the
                     counter: that one is turned off to see the foot of the
                     picture, and these are up in its corners. See
                     `paintMarks`. -->
                <button class="menu-item" id="marks-show" type="button" aria-pressed="true"
                        data-i18n-title="editor.marksShow.title">
                  <span data-i18n="editor.marksShow">インジケータ</span>
                  <span class="menu-key"><span class="tick">✓</span></span>
                </button>
                <!-- Which subtitles to draw, and 表示しない first because
                     that is what a cutting screen is for: the picture under
                     the playhead is what a cut is judged by. Away on a
                     recording that carries none; `paintSubsPicker` writes
                     the lines. See `subs.rs`. -->
                <div id="subs-pick" hidden>
                  <div class="menu-sep"></div>
                  <div class="menu-head" data-i18n="subs.label">字幕</div>
                  <div id="subs-track"></div>
                </div>
              </div>
            </div>
            <!-- The playback controls, down here beside 表示 rather than on a
                 row of their own: a row for four buttons and the sound was a
                 row taken off the picture. Marks rather than words, and flat
                 until they are pointed at or lit, so the four take the room
                 of one worded button and do not read as part of the cutting.

                 Separate from the rows above because they are a separate
                 question. Those rows are where a cut is placed -- every
                 button in them moves the playhead a measured distance or
                 marks it -- and these are about watching what the cut came
                 to. 再生 once stood in the middle group and was the one button
                 in it that was not part of the symmetry around ✂.

                 The stepping buttons the reference tool repeats beside its
                 playback are not repeated here. They are in the row above,
                 doing exactly what they would do here, and a window with two
                 of the same button is a window that has to say why. -->
            <div class="tgroup flat" id="playback">
              <button id="rewind" class="seek" data-i18n-title="t.rewind">◀◀</button>
              <!-- ▶ swaps to ■ while it is playing, so `paintPlay` writes
                   it. -->
              <button id="play" class="play" data-i18n-title="t.play.title">▶</button>
              <button id="fast-fwd" class="seek" data-i18n-title="t.fastFwd">▶▶</button>
              <!-- A mode rather than an action: it stays lit while it holds,
                   and what it changes is what ▶ does next. -->
              <button id="loop" class="tool" type="button" aria-pressed="false"
                      data-i18n-title="t.loop.title">⟲</button>
            </div>
            <!-- The level the preview is listened to at, which is nothing to
                 do with the level that gets written: the output carries the
                 recording's own sound whatever this says.

                 ♪ with a line through it rather than a loudspeaker: the
                 glyphs for one are emoji, and an emoji in a row of ◀ ▶ ⚑ ✂
                 is a picture in a row of marks.

                 How much of the bar is filled says the level, which is the
                 one thing a slider is for; the number is in its tooltip.
                 The share is written onto the element as `--at` by
                 `showVolume`, and the stylesheet draws the bar out of it. -->
            <div class="vol tgroup flat">
              <button id="mute" type="button" aria-pressed="false"
                      data-i18n-title="t.mute">♪</button>
              <input id="volume" class="vslider" type="range" min="0" max="100" step="1"
                     value="100" data-i18n-aria="t.volume.aria" />
            </div>
            <!-- The one line the window says things on -- what a read found,
                 why playback waited, what a detection came to. It takes the
                 rest of the row, up to the two buttons. -->
            <span class="dim" id="status"></span>
            <button id="editor-ok" class="primary wide" data-i18n="editor.ok">OK</button>
            <button id="editor-cancel" class="secondary" data-i18n="editor.cancel">キャンセル</button>
          </div>
        </footer>
      </div>
    </main>
    <!-- 書き出すトラック. Built the same way the list window's panels are,
         out of plain elements rather than <dialog>: what a released build's
         webview does with that is not something to find out afterwards.

         It is a menu and not a screen because what it settles is about one
         clip and is settled rarely -- a bilingual recording whose dub is not
         wanted says so once. The cuts are what this window is for, and the
         tracks must not be in front of them. -->
    <div id="tracks-modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="tracks-title">
        <div class="modal-head" id="tracks-title" data-i18n="tracks.title">書き出すトラック</div>
