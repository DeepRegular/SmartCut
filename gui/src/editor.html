<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="editor.title">カット編集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- The cut editor, in its own window. Opened on one clip out of the list
       and left again with OK or キャンセル; the list window is what says which
       clip, and what becomes of the cuts afterwards. -->
  <body>
    <header class="tabs">
      <span class="tab active still" data-i18n="editor.title">カット編集</span>
      <span class="title" id="title" data-i18n="editor.loading">読み込み中…</span>
    </header>

    <div class="infobar">
      <span id="info">—</span>
      <span class="spacer"></span>
      <!-- Its label counts a detection up while one is running, so it is
           `main.js` that writes it and not `applyStatic`. -->
      <button id="tracks" class="mini wide" data-i18n="tracks.button"
              data-i18n-title="tracks.button.title">トラック</button>
      <button id="detect-cm" class="mini wide" data-i18n-title="editor.detectCm.title">CM を検出</button>
    </div>

    <main>
      <!-- Keyframes down the left, where the reference tool keeps them: the
           marks you navigate by, not the edit itself. -->
      <aside class="clips">
        <div class="clips-head">
          <span data-i18n="editor.keyframes">キーフレーム</span> <span id="key-count" class="dim"></span>
        </div>
        <ol id="keyframes"></ol>
      </aside>

      <div class="editor">
        <div class="stage">
          <img id="preview" alt="" />
          <div class="overlay">
            <div class="ovl-main">
              <span id="ovl-frame">—</span>
              <span id="ovl-time">--:--:--.--</span>
            </div>
            <div class="ovl-sub">
              <span id="ovl-kind">—</span>
              <span id="ovl-sel" data-i18n="editor.selectionNone">選択 —</span>
            </div>
          </div>
          <div id="searching" class="searching" data-i18n="editor.searching" hidden>サーチ中</div>
        </div>

        <div class="strip-wrap">
          <div id="strip" class="strip">
            <div id="reel" class="reel"></div>
            <div id="playline" class="playline" hidden></div>
          </div>
          <div class="strip-foot">
            <span class="dim" data-i18n-html="editor.stripHint"></span>
            <span class="spacer"></span>
            <span id="warm" class="warm"></span>
            <label class="opt"><span data-i18n="editor.stripShow">表示</span>
              <select id="strip-step">
                <option value="gop:3" data-i18n="strip.gop3">GOP・3 秒</option>
                <option value="gop:6" selected data-i18n="strip.gop6">GOP・6 秒</option>
                <option value="gop:30" data-i18n="strip.gop30">GOP・30 秒</option>
                <option value="gop:180" data-i18n="strip.gop180">GOP・3 分</option>
                <option value="frame" data-i18n="strip.frame">フレーム</option>
              </select>
            </label>
          </div>
        </div>

        <div class="track-wrap">
          <canvas id="track" height="84"></canvas>
          <div id="hover" class="hover" hidden>
            <img id="hover-img" alt="" />
            <div class="hover-foot"><span id="hover-time">--:--:--.--</span><span id="hover-kind"></span></div>
          </div>
        </div>

        <!-- Laid out like the reference tool's: the cut sits in the middle,
             IN to its left and OUT to its right, and the ways of getting
             about radiate outwards from there.

             The three clusters are their own elements so that a window too
             narrow for one line breaks it between them, keeping the symmetry
             around the cut on whichever line it lands. The row used to be one
             flat, unwrapping line that scrolled instead -- and the scroll bar
             it grew lay across the bottom of the buttons, where it swallowed
             the clicks meant for them. At the window's own default width. -->
        <div class="transport">
          <div class="tgroup">
            <button id="add-key" class="flag" data-i18n="t.addKey" data-i18n-title="t.addKey.title">⚑ キーフレーム</button>
            <button id="prev-scene" class="tool" data-i18n="t.prevScene" data-i18n-title="t.prevScene.title" disabled>⇤ シーン</button>
            <button id="next-scene" class="tool" data-i18n="t.nextScene" data-i18n-title="t.nextScene.title" disabled>シーン ⇥</button>
          </div>

          <div class="tgroup">
            <!-- The play button's label swaps to ■ 停止 while it is playing,
                 so `setPlaying` writes it. -->
            <button id="play" class="play" data-i18n-title="t.play.title">▶ 再生</button>
            <button id="go-start" data-i18n-title="t.goStart">|◀</button>
            <button id="prev-kf" data-i18n-title="t.prevKf">◀|</button>
            <button id="step-back" data-i18n-title="t.stepBack">◀</button>
            <button id="goto-in" data-i18n-title="t.gotoIn">⇤|</button>
            <button id="set-in" class="mark" data-i18n-title="t.setIn">[ IN</button>
            <button id="cut-range" class="cut" data-i18n="t.cut" data-i18n-title="t.cutRange">✂ カット</button>
            <button id="set-out" class="mark" data-i18n-title="t.setOut">OUT ]</button>
            <button id="goto-out" data-i18n-title="t.gotoOut">|⇥</button>
            <button id="step-fwd" data-i18n-title="t.stepFwd">▶</button>
            <button id="next-kf" data-i18n-title="t.nextKf">|▶</button>
            <button id="go-end" data-i18n-title="t.goEnd">▶|</button>
          </div>

          <div class="tgroup">
            <button id="cut-outside" class="tool" data-i18n="t.cutOutside" data-i18n-title="t.cutOutside.title">外側をカット</button>
            <button id="snap" class="tool" data-i18n="t.snap" data-i18n-title="t.snap.title">無劣化点へ吸着</button>
            <button id="undo-cut" class="tool" data-i18n="t.undo" data-i18n-title="t.undo.title" disabled>↺ 取消</button>
            <button id="clear-all" class="tool" data-i18n="t.clearAll" data-i18n-title="t.clearAll.title">全消去</button>
          </div>
        </div>

        <div class="statusbar">
          <span class="counter" id="counter">— / —</span>
          <span class="dim" id="selection" data-i18n="editor.selectionNone">選択 —</span>
          <span class="spacer"></span>
          <span class="dim" id="cm-note"></span>
        </div>

        <footer class="output">
          <div class="panel">
            <div class="bar"><span id="copied-bar"></span></div>
            <div class="plan-text" id="plan-text" data-i18n="plan.openFile">ファイルを開いてください</div>
            <ul id="segments"></ul>
          </div>
          <!-- No 出力 button here. What gets written, where, and in what
               container is one answer for the whole list, and it is settled
               on the list window's own screens.

               OK and キャンセル instead, as the reference tool has them: this
               window is opened on one clip and left again, and those two are
               what say which way you left it. -->
          <div class="export">
            <span class="badge" id="smart-badge">—</span>
            <span class="dim" id="status"></span>
            <span class="spacer"></span>
            <button id="editor-ok" class="primary wide" data-i18n="editor.ok">OK</button>
            <button id="editor-cancel" class="secondary" data-i18n="editor.cancel">キャンセル</button>
          </div>
        </footer>
      </div>
    </main>
    <!-- 書き出すトラック. Built the same way the list window's panels are,
         out of plain elements rather than <dialog>: what a released build's
         webview does with that is not something to find out afterwards.

         It is a menu and not a screen because what it settles is about one
         clip and is settled rarely -- a bilingual recording whose dub is not
         wanted says so once. The cuts are what this window is for, and the
         tracks must not be in front of them. -->
    <div id="tracks-modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="tracks-title">
        <div class="modal-head" id="tracks-title" data-i18n="tracks.title">書き出すトラック</div>
        <div class="modal-body">
          <ul id="tracks-list" class="tracks"></ul>
          <p class="dim" data-i18n="tracks.note"></p>
        </div>
        <div class="modal-foot">
          <button id="tracks-close" class="primary" data-i18n="tracks.close">閉じる</button>
        </div>
      </div>
    </div>

    <script src="main.js" type="module"></script>
  </body>
</html>
