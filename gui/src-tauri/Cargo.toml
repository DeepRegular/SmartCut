[package]
name = "gui"
version = "0.9.2"
description = "SmartCut"
edition = "2021"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The desktop's own notice when a long run finishes behind another window.
# Called from Rust only (`notify_done`), so no capability is granted to the
# pages for it. Held below 2.5, which wants tauri 2.12 and would move tauri,
# wry and tao along with it.
tauri-plugin-notification = ">=2.4, <2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
smartcut-core = { path = "../../rust/crates/core" }
# The updater (`update.rs`): the release's files over HTTPS, and the signature
# each one carries, checked against the key built into this program. rustls
# with its own roots rather than the system's TLS, because a portable build
# runs on systems whose certificate store it cannot count on finding.
ureq = { version = "3", default-features = false, features = ["rustls"] }
minisign-verify = "0.3"

# Already in the build through tauri; named here for the one thing done to
# GTK directly -- see `no_window_dragging`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The portable tar.gz, unpacked by the updater.
tar = { version = "0.4", default-features = false }
flate2 = "1"

# The portable zip, unpacked by the updater.
[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
