[package]
name = "gui"
version = "0.8.18"
description = "SmartCut"
edition = "2021"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
smartcut-core = { path = "../../rust/crates/core" }

# Already in the build through tauri; named here for the one thing done to
# GTK directly -- see `no_window_dragging`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
