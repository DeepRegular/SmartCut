[package]
name = "gui"
version = "0.8.20"
description = "SmartCut"
edition = "2021"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The desktop's own notice when a long run finishes behind another window.
# Called from Rust only (`notify_done`), so no capability is granted to the
# pages for it. Held below 2.5, which wants tauri 2.12 and would move tauri,
# wry and tao along with it.
tauri-plugin-notification = ">=2.4, <2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
smartcut-core = { path = "../../rust/crates/core" }

# Already in the build through tauri; named here for the one thing done to
# GTK directly -- see `no_window_dragging`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
